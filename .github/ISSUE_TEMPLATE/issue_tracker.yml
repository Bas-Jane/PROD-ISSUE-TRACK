
name: Product Issue Tracker
description: Create and track product issues
title: "[ISSUE] "
labels: ["needs-triage"]

body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the issue category
      options:
        - Bug
        - Enhancement
        - Configuration
        - Automation
        - Testing
        - Documentation
        - Integration
        - Security
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the issue priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: workflow-stage
    attributes:
      label: Workflow Stage
      description: Initial progress stage
      options:
        - To Do
        - In Progress
        - Blocked
        - Done
      default: 0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Describe the problem or requirement
      placeholder: Explain the issue and expected outcome
    validations:
      required: true