name: "Production Incident - Sev1"
description: "Critical outage or major production service unavailability"
title: "[Production Incident][Sev1] "
labels:
  - "Production-Incident"
  - "Prod::Sev1"
body:
  - type: markdown
    attributes:
      value: |
        Report a production incident. This form assigns Production-Incident and Prod::Sev1 automatically.
        Do not paste credentials, personal data, access tokens, or customer identifiers.
  - type: input
    id: service
    attributes:
      label: Affected service or component
      placeholder: "Example: AMF registration service"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Incident description
      description: "What happened, and when did it start?"
      placeholder: "Describe symptoms and timeline"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Production impact
      description: "Describe affected functionality and scope without exposing sensitive data."
    validations:
      required: true
  - type: textarea
    id: investigation
    attributes:
      label: Troubleshooting and evidence
      description: "Summarize checks performed. Redact logs before pasting."
    validations:
      required: false
  - type: textarea
    id: mitigation
    attributes:
      label: Mitigation or resolution
      description: "Describe mitigation, workaround, recovery, or next steps."
    validations:
      required: false
  - type: input
    id: references
    attributes:
      label: Related issue or change reference
      placeholder: "Example: #123"
    validations:
      required: false
