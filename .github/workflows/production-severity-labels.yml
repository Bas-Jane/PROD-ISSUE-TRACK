name: Apply production incident severity labels

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing issue number to synchronize (e.g. 5)"
        required: true
        type: number

permissions:
  issues: write

jobs:
  sync-severity:
    runs-on: ubuntu-latest
    steps:
      - name: Apply severity and category labels
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;
            if (!Number.isInteger(issue_number) || issue_number < 1) {
              throw new Error('Invalid issue number');
            }

            // Fetch fresh issue data (not an older webhook snapshot).
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number
            });
            if (issue.pull_request) {
              core.info('Skipping pull request');
              return;
            }

            const body = (issue.body || '').replace(/\r\n/g, '\n');
            const isIncident = /^\[Prod\]\[Incident\]/i.test(issue.title.trim())
              && /^### Production Severity\s*$/m.test(body);
            if (!isIncident) {
              core.info(`Issue #${issue_number} is not a production incident form; skipping.`);
              return;
            }

            const match = body.match(/^### Production Severity[ \t]*\n+(?:[ \t]*\n)*[ \t]*(S[1-4])[ \t]*(?=\n|$)/m);
            if (!match) {
              core.warning(`Issue #${issue_number} has no recognizable S1-S4 severity.`);
              return;
            }
            const desired = `Prod::Sev${match[1].slice(1)}`;
            const category = 'Category::Production-Incident';
            const allSeverityLabels = [
              'Prod::Sev1', 'Prod::Sev2', 'Prod::Sev3', 'Prod::Sev4',
              'Prod::S1', 'Prod::S2', 'Prod::S3', 'Prod::S4'
            ];

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({owner, repo, name});
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name, color, description
                  });
                  core.info(`Created label ${name}`);
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  // Label already created by a simultaneous run.
                }
              }
            }

            await ensureLabel(category, '1D76DB', 'Production incidents');
            await ensureLabel(desired, 'B60205', `Production incident ${match[1]}`);

            const old = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            for (const label of allSeverityLabels) {
              if (label === desired || !old.includes(label)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number, name: label
                });
                core.info(`Removed ${label}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const missing = [category, desired].filter(name => !old.includes(name));
            if (missing.length) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: missing
              });
            }
            core.info(`Issue #${issue_number}: synced ${category} and ${desired}`);
