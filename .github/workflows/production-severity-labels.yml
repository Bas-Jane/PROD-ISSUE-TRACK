name: Apply production incident severity labels

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional existing issue number; leave empty to initialize labels only'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  sync-production-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize labels and synchronize production incident
        uses: actions/github-script@v8
        env:
          OPTIONAL_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const category = 'Production-Incident';
            const categoryColor = 'F28C28'; // orange
            const severityColor = 'B60205'; // red
            const severities = [1, 2, 3, 4].map(n => `Prod::Sev${n}`);
            const oldLabels = ['Category::Production-Incident', ...[1,2,3,4].map(n => `Prod::S${n}`)];

            async function ensureLabel(name, color, description) {
              try {
                const { data } = await github.rest.issues.getLabel({ owner, repo, name });
                if (data.color.toUpperCase() !== color || data.description !== description) {
                  await github.rest.issues.updateLabel({ owner, repo, name, color, description });
                  core.info(`Updated label ${name}`);
                }
              } catch (err) {
                if (err.status !== 404) throw err;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                  core.info(`Created label ${name}`);
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  core.info(`Label already created: ${name}`);
                }
              }
            }

            // Initialize labels for this repository, including on manual runs with no issue number.
            await ensureLabel(category, categoryColor, 'Production incident');
            for (const name of severities) {
              await ensureLabel(name, severityColor, 'Production incident severity');
            }

            let issueNumber;
            if (context.eventName === 'issues') {
              issueNumber = context.payload.issue?.number;
            } else {
              const entered = String(process.env.OPTIONAL_ISSUE_NUMBER || '').trim();
              if (!entered) {
                core.notice('All five labels initialized. No issue number supplied.');
                return;
              }
              if (!/^[1-9]\d*$/.test(entered)) {
                throw new Error(`Invalid issue number: ${entered}`);
              }
              issueNumber = Number(entered);
            }

            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
              throw new Error('Unable to determine a valid issue number');
            }

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            if (issue.pull_request) {
              core.info('Skipping pull request');
              return;
            }
            const body = (issue.body || '').replace(/\r\n?/g, '\n');
            if (!/^\[Prod\]\[Incident\]/i.test(issue.title.trim()) ||
                !/^### Production Severity\s*$/m.test(body)) {
              core.info(`Skipping non-production incident #${issueNumber}`);
              return;
            }
            const match = body.match(/^### Production Severity[ \t]*\n(?:[ \t]*\n)*[ \t]*(S[1-4])[ \t]*(?=\n|$)/m);
            if (!match) {
              core.warning(`Production incident #${issueNumber} has no valid S1–S4 selection.`);
              return;
            }

            const selected = `Prod::Sev${match[1].slice(1)}`;
            const current = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            const managed = new Set([category, ...severities, ...oldLabels]);
            const unrelated = current.filter(name => !managed.has(name));
            const desired = [category, selected, ...unrelated];
            const sameLabels = current.length === desired.length && desired.every(name => current.includes(name));
            if (!sameLabels) {
              await github.rest.issues.setLabels({ owner, repo, issue_number: issueNumber, labels: desired });
            }
            core.notice(`Issue #${issueNumber}: ${category}, ${selected}`);
