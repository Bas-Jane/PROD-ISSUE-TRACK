name: Apply production incident severity labels

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to synchronize (e.g. 7)'
        required: true
        type: number

permissions:
  issues: write

jobs:
  sync-severity:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize Production Incident labels
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error('A valid issue number is required.');
            }
            const {data: issue} = await github.rest.issues.get({owner, repo, issue_number});
            if (issue.pull_request) return;
            const body = (issue.body || '').replace(/\r\n/g, '\n');
            const isIncident = /^\[Prod\]\[Incident\]/i.test(issue.title.trim()) &&
              /^### Production Severity\s*$/m.test(body);
            if (!isIncident) {
              core.info(`Skipping non-production incident #${issue_number}`);
              return;
            }
            const match = body.match(/^### Production Severity[ \t]*\n+(?:[ \t]*\n)*[ \t]*(S[1-4])[ \t]*(?=\n|$)/m);
            if (!match) {
              core.warning(`No S1-S4 value detected in #${issue_number}`);
              return;
            }
            const wantedSeverity = `Prod::Sev${match[1].slice(1)}`;
            const category = 'Production-Incident';
            const oldCategory = 'Category::Production-Incident';
            const severityLabels = new Set([
              'Prod::Sev1', 'Prod::Sev2', 'Prod::Sev3', 'Prod::Sev4',
              'Prod::S1', 'Prod::S2', 'Prod::S3', 'Prod::S4'
            ]);
            const colors = {
              'Prod::Sev1': 'B60205',
              'Prod::Sev2': 'D93F0B',
              'Prod::Sev3': 'FBCA04',
              'Prod::Sev4': '0E8A16'
            };
            async function ensureLabel(name, color) {
              try {
                const {data: existing} = await github.rest.issues.getLabel({owner, repo, name});
                if (existing.color.toUpperCase() !== color.toUpperCase()) {
                  await github.rest.issues.updateLabel({owner, repo, name, color});
                  core.info(`Updated ${name} color to #${color}`);
                }
              } catch (err) {
                if (err.status !== 404) throw err;
                try {
                  await github.rest.issues.createLabel({owner, repo, name, color});
                } catch (createErr) {
                  if (createErr.status !== 422) throw createErr;
                }
              }
            }
            await ensureLabel(wantedSeverity, colors[wantedSeverity]);
            await ensureLabel(category, 'F28C28'); // orange, including existing labels

            const current = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            // Keep other labels; request Category first and Severity second. GitHub UI may reorder badges.
            const unrelated = current.filter(name => !severityLabels.has(name) &&
              name !== category && name !== oldCategory);
            const desiredLabels = [category, wantedSeverity, ...unrelated];
            const unchanged = current.length === desiredLabels.length &&
              desiredLabels.every(name => current.includes(name));
            if (!unchanged) {
              await github.rest.issues.setLabels({owner, repo, issue_number, labels: desiredLabels});
            }
            core.info(`#${issue_number} category: ${category} (#F28C28); severity: ${wantedSeverity}`);
